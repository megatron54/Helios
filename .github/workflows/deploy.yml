name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.61

      - name: Build WASM
        run: |
          mkdir -p engine/wasm/build
          cd engine/wasm/build
          emcmake cmake ..
          cmake --build .
          # Copy to a flat directory for artifact upload
          mkdir -p /tmp/wasm-out
          cp helios.js helios.wasm /tmp/wasm-out/

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-build
          path: /tmp/wasm-out/

  build-frontend:
    runs-on: ubuntu-latest
    needs: build-wasm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-build
          path: frontend/public/

      - name: Verify WASM files
        run: |
          echo "Contents of frontend/public/:"
          ls -la frontend/public/
          test -f frontend/public/helios.js || (echo "ERROR: helios.js not found" && exit 1)
          test -f frontend/public/helios.wasm || (echo "ERROR: helios.wasm not found" && exit 1)

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify dist output
        run: |
          echo "Contents of frontend/dist/:"
          ls -la frontend/dist/
          ls -la frontend/dist/assets/ | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build-frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
